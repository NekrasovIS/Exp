name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # issue #169: macOS-раннеры этого аккаунта — общий, сильно
  # ограниченный по конкурентности ресурс (обычно один одновременный
  # job), а build-and-test занимает часы. Без отмены устаревших
  # прогонов при повторном пуше в ту же ветку/PR они просто копятся в
  # очереди друг за другом — реальная причина того, что job выглядит
  # "зависшим": он не падает, он часами ждёт своей очереди за
  # прогонами по более старым, уже неактуальным коммитам.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # issue #169: macos-14 не пережил ни одного прогона этого job'а
    # даже после фикса кэша (x-gha) — раннер обрывается ~1ч20-25м внутрь
    # шага Configure, без финального лога (инфраструктурный предел
    # GitHub-хостинга macOS-раннеров на этом аккаунте, не что-то
    # исправимое правкой workflow). Бизнес-логика проекта кроссплатформенна
    # по CLAUDE.md — ubuntu-latest быстрее и стабильнее на GitHub-хостинге;
    # macOS-специфика (codesign, permissions) остаётся непроверенной этим
    # job'ом, но это уже лучше, чем job, который никогда не завершается.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Нативный GitHub Actions cache backend vcpkg (x-gha) заливает в
      # кэш каждый собранный порт сразу по готовности — упавший на
      # середине прогон всё равно сохраняет то, что успел собрать.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache environment variables (vcpkg x-gha backend)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install build dependencies (autotools for vcpkg's libb2 port, X11/xkbcommon/OpenGL/PulseAudio dev headers for qtbase's Linux platform plugin)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake libtool libltdl-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev \
            libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxcb-xinput-dev libsm-dev libice-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libatspi2.0-dev \
            libgl1-mesa-dev libglu1-mesa-dev libpulse-dev libdrm-dev \
            libfontconfig1-dev libfreetype-dev nasm

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        # Никакого реального дисплея на раннере нет — Qt-тесты всё равно
        # создают настоящие QWidget/QApplication (структура окна,
        # заполнение списков), просто без реального захвата устройств
        # (см. README, раздел «Тесты»); offscreen-платформенный плагин
        # Qt не требует ни X-сервера, ни xvfb.
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    # Сборки ASan+UBSan и ThreadSanitizer (issue #145). Пока
    # рекомендательные (continue-on-error), не блокируют мерж — согласно
    # issue #145, базовая линия санитайзеров должна сначала
    # стабилизироваться; находки становятся отдельными отслеживаемыми
    # багами, а не блокируют тот PR, который их случайно обнаружил.
    # ASan+UBSan собираются GCC раннера по умолчанию — этой связке
    # LLVM-специфичные флаги не нужны, в отличие от coverage/fuzzing.
    #
    # TSan, наоборот, собирается Clang (см. шаг "Install Clang" и
    # -DCMAKE_CXX_COMPILER=clang++ ниже) — issue #170: под GCC-версией
    # libtsan на этих раннерах TSan падает с
    # "FATAL: ThreadSanitizer: unexpected memory mapping" ещё до начала
    # любого реального теста (известная несовместимость более старой
    # libtsan, поставляемой с GCC, с раскладкой адресного пространства
    # современного ядра — не имеет отношения к коду самого проекта).
    # Под Clang та же самая сборка (с тем же фиксом
    # CPPHTTPLIB_USE_NON_BLOCKING_GETADDRINFO чуть ниже, у себя в
    # CMakeLists.txt) проходит чисто — подтверждено воспроизведением
    # локально в Docker-контейнере на Ubuntu 24.04 под обоими
    # компиляторами: GCC 13 стабильно ловит "unexpected memory mapping"
    # на первом же тесте, реально поднимающем HTTP-клиент/сервер, Clang
    # 18 — ни разу за 20 прогонов подряд.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, user-service, chat-service]
        sanitizer: [asan-ubsan, tsan]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install autotools (needed by vcpkg's libsodium port, a user-service dependency)
        run: sudo apt-get update && sudo apt-get install -y autoconf autoconf-archive automake libtool

      # issue #170 — только для TSan-ветки матрицы, см. комментарий на
      # уровне джобы выше о том, почему именно Clang.
      - name: Install Clang (TSan only — issue #170)
        if: matrix.sanitizer == 'tsan'
        run: sudo apt-get install -y clang

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-services-${{ matrix.service }}-${{ runner.os }}-${{ hashFiles(format('services/{0}/vcpkg.json', matrix.service)) }}
          restore-keys: |
            vcpkg-services-${{ matrix.service }}-${{ runner.os }}-

      - name: Start Postgres (docker compose)
        run: docker compose up -d --wait

      - name: Configure (ASan+UBSan)
        if: matrix.sanitizer == 'asan-ubsan'
        run: >
          cmake -S services/${{ matrix.service }} -B services/${{ matrix.service }}/build-sanitizer
          -DDEVICEHUB_ENABLE_ASAN_UBSAN=ON

      - name: Configure (TSan)
        if: matrix.sanitizer == 'tsan'
        run: >
          cmake -S services/${{ matrix.service }} -B services/${{ matrix.service }}/build-sanitizer
          -DCMAKE_CXX_COMPILER=clang++ -DDEVICEHUB_ENABLE_TSAN=ON

      - name: Build
        run: cmake --build services/${{ matrix.service }}/build-sanitizer --parallel

      - name: Test
        working-directory: services/${{ matrix.service }}/build-sanitizer
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --output-on-failure

  coverage:
    # Source-based code coverage (issue #146) — Clang-only (LLVM's
    # -fprofile-instr-generate/-fcoverage-mapping), same Linux-runner
    # pattern already proven for the fuzz/services jobs below. Root
    # DeviceHub isn't included here — it would need its own Linux/Clang
    # build of Qt6+WebRTC from vcpkg, a much bigger lift than these three
    # services; can be added later if that's worth doing.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            test_binary: auth_service_tests
          - service: user-service
            test_binary: user_service_tests
          - service: chat-service
            test_binary: chat_service_tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang and LLVM coverage tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Install autotools (needed by vcpkg's libsodium port, a user-service dependency)
        run: sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-services-${{ matrix.service }}-${{ runner.os }}-${{ hashFiles(format('services/{0}/vcpkg.json', matrix.service)) }}
          restore-keys: |
            vcpkg-services-${{ matrix.service }}-${{ runner.os }}-

      - name: Start Postgres (docker compose)
        run: docker compose up -d --wait

      - name: Configure
        run: >
          cmake -S services/${{ matrix.service }} -B services/${{ matrix.service }}/build-coverage
          -DCMAKE_CXX_COMPILER=clang++ -DDEVICEHUB_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build services/${{ matrix.service }}/build-coverage --parallel

      - name: Test (with coverage profiling)
        working-directory: services/${{ matrix.service }}/build-coverage
        # ctest via gtest_discover_tests launches the test binary once per
        # discovered TEST(); "%p" substitutes each run's own PID so the
        # per-process .profraw files never collide with each other.
        run: LLVM_PROFILE_FILE="%p.profraw" ctest --output-on-failure

      - name: Generate coverage report
        working-directory: services/${{ matrix.service }}/build-coverage
        # Второй вызов llvm-cov report (-show-functions) — не для
        # человека в логе, а источник per-функциональной детализации
        # для дашборда (tools/ci-metrics/collect.py::
        # parse_per_function_coverage()) — какая именно функция
        # недопокрыта, а не только общий % по файлу/сервису.
        # -show-functions требует явного списка файлов (в отличие от
        # обычного report выше) — тот же список файлов, что уже
        # implicitly покрыт -ignore-filename-regex у остальных вызовов.
        # -Xdemangler=c++filt — иначе имена функций в логе (и в базе)
        # были бы нечитаемым mangled-мусором вида "_ZN11chat_service...".
        run: |
          llvm-profdata merge -sparse *.profraw -o coverage.profdata
          llvm-cov report ./${{ matrix.test_binary }} \
            -instr-profile=coverage.profdata \
            -ignore-filename-regex='(/test/|/vcpkg_installed/)'
          llvm-cov report ./${{ matrix.test_binary }} \
            -instr-profile=coverage.profdata \
            -show-functions -Xdemangler=c++filt \
            $(find ../src -name '*.cpp' -o -name '*.h')
          llvm-cov show ./${{ matrix.test_binary }} \
            -instr-profile=coverage.profdata \
            -ignore-filename-regex='(/test/|/vcpkg_installed/)' \
            -format=html -output-dir=coverage-html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/build-coverage/coverage-html

  services:
    # Separate job on Linux rather than folding into build-and-test above:
    # GitHub-hosted macOS runners don't support the `services:`/`container:`
    # Docker features these three microservices' Postgres-backed tests need
    # (issue #134 — previously none of them ran in CI at all).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, user-service, chat-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-services-${{ matrix.service }}-${{ runner.os }}-${{ hashFiles(format('services/{0}/vcpkg.json', matrix.service)) }}
          restore-keys: |
            vcpkg-services-${{ matrix.service }}-${{ runner.os }}-

      # user-service and chat-service need a live Postgres for most of
      # their tests; auth-service doesn't use one, but starting it
      # unconditionally keeps this step identical across the matrix. Tests
      # that also need a live auth-service/user-service (not just Postgres)
      # skip themselves (GTEST_SKIP) rather than failing — see each test
      # file's own "Requires a live ..." comment — so this alone doesn't
      # give full cross-service integration coverage, only each service's
      # own business logic against a real database.
      - name: Start Postgres (docker compose)
        run: docker compose up -d --wait

      # Same class of dependency as build-and-test's own autotools step
      # above (there for libb2, here for user-service's libsodium) —
      # vcpkg builds these ports from their upstream autotools build
      # system rather than vendoring a CMake port for them.
      - name: Install autotools (needed by vcpkg's libsodium port, a user-service dependency)
        run: sudo apt-get update && sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Configure
        run: cmake -S services/${{ matrix.service }} -B services/${{ matrix.service }}/build

      - name: Build
        run: cmake --build services/${{ matrix.service }}/build --parallel

      - name: Test
        run: ctest --test-dir services/${{ matrix.service }}/build --output-on-failure

  fuzz:
    # Real coverage-guided fuzzing (issue #121/#132/#133) — replaces the
    # "clang-cl unavailable on this Windows dev machine" blocker with
    # ubuntu-latest, which ships Clang (and its bundled libFuzzer runtime)
    # out of the box. A bounded smoke run (-max_total_time), not a full
    # scheduled fuzzing campaign — this catches regressions on every
    # push/PR; long-running exploratory fuzzing is a separate concern.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: chat-service
            targets: base64_fuzz json_guard_fuzz
          - service: auth-service
            targets: token_verify_fuzz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-services-${{ matrix.service }}-${{ runner.os }}-${{ hashFiles(format('services/{0}/vcpkg.json', matrix.service)) }}
          restore-keys: |
            vcpkg-services-${{ matrix.service }}-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -S services/${{ matrix.service }} -B services/${{ matrix.service }}/build-fuzz
          -DCMAKE_CXX_COMPILER=clang++ -DDEVICEHUB_ENABLE_FUZZING=ON

      - name: Build fuzz targets
        run: cmake --build services/${{ matrix.service }}/build-fuzz --target ${{ matrix.targets }} --parallel

      - name: Run fuzz targets (bounded smoke run)
        run: |
          for target in ${{ matrix.targets }}; do
            echo "::group::$target"
            ./services/${{ matrix.service }}/build-fuzz/$target -max_total_time=30
            echo "::endgroup::"
          done

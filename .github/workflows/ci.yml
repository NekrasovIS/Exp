name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # issue #169: macOS-раннеры этого аккаунта — общий, сильно
  # ограниченный по конкурентности ресурс (обычно один одновременный
  # job), а build-and-test занимает часы. Без отмены устаревших
  # прогонов при повторном пуше в ту же ветку/PR они просто копятся в
  # очереди друг за другом — реальная причина того, что job выглядит
  # "зависшим": он не падает, он часами ждёт своей очереди за
  # прогонами по более старым, уже неактуальным коммитам.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      # issue #169: собранная сборка Qt6+WebRTC из исходников через
      # vcpkg занимает часы, и этот job не всегда успевает/успешно
      # доживает до конца — а actions/cache сохраняет кэш только один
      # раз, post-step'ом в самом конце job. Раз job ни разу не дожил
      # до конца, кэш ни разу не сохранялся, и каждый следующий прогон
      # снова собирал всё с нуля. Нативный GitHub Actions cache backend
      # vcpkg (x-gha) заливает в кэш каждый собранный порт сразу по
      # готовности — упавший на середине прогон всё равно сохраняет
      # то, что успел собрать.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache environment variables (vcpkg x-gha backend)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install autotools (needed by vcpkg's libb2 port, a qtbase dependency)
        run: brew install autoconf autoconf-archive automake libtool

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

services:
  user-service-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user_service
      # Local-dev-only default; override via POSTGRES_PASSWORD for anything
      # beyond a throwaway local instance — see CLAUDE.md, "Безопасность".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
      POSTGRES_DB: user_service
    ports:
      # Host port 5433, not 5432 — this machine may already run another
      # project's Postgres on the default port.
      - "5433:5432"
    volumes:
      - user-service-postgres-data:/var/lib/postgresql/data
      - ./services/user-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service"]
      interval: 5s
      timeout: 3s
      retries: 5

  chat-service-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chat_service
      POSTGRES_PASSWORD: ${CHAT_SERVICE_POSTGRES_PASSWORD:-dev-only-password}
      POSTGRES_DB: chat_service
    ports:
      # 5432 and 5433 are already taken (see above) — next free port.
      - "5434:5432"
    volumes:
      - chat-service-postgres-data:/var/lib/postgresql/data
      - ./services/chat-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_service"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Метрики CI (issue #193) — отдельная БД, тот же паттерн "своя Postgres
  # на сервис", что и у auth/user/chat-service выше, хотя это и не сам
  # DeviceHub, а служебная инфраструктура разработки. Наполняется
  # tools/ci-metrics/collect.py (опрос GitHub Actions API), не самим CI —
  # раннеры GitHub Actions не имеют сетевого доступа к этой локальной
  # машине, поэтому это pull, а не push. За профилем "ci-metrics" — не
  # часть обычного `docker compose up -d` для разработки самого
  # DeviceHub/сервисов, поднимается отдельно
  # (`docker compose --profile ci-metrics up -d`).
  ci-metrics-postgres:
    profiles: ["ci-metrics"]
    image: postgres:16
    environment:
      POSTGRES_USER: ci_metrics
      POSTGRES_PASSWORD: ${CI_METRICS_POSTGRES_PASSWORD:-dev-only-password}
      POSTGRES_DB: ci_metrics
    ports:
      - "5435:5432"
    volumes:
      - ci-metrics-postgres-data:/var/lib/postgresql/data
      - ./tools/ci-metrics/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_metrics"]
      interval: 5s
      timeout: 3s
      retries: 5

  grafana:
    profiles: ["ci-metrics"]
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      # Local-dev-only default, same convention as the Postgres passwords
      # above — override via GF_SECURITY_ADMIN_PASSWORD for anything
      # beyond a throwaway local instance.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-dev-only-password}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Позволяет datasource-provisioning-файлу ниже подставить пароль из
      # переменной окружения ($CI_METRICS_POSTGRES_PASSWORD), а не
      # хранить его как литерал в закоммиченном YAML.
      GF_ENABLE_ENVIRONMENT_VARIABLE_EXPANSION: "true"
      CI_METRICS_POSTGRES_PASSWORD: ${CI_METRICS_POSTGRES_PASSWORD:-dev-only-password}
    volumes:
      - ./tools/ci-metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./tools/ci-metrics/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      ci-metrics-postgres:
        condition: service_healthy

  # SFU-инфраструктура для групповых звонков (issue #123/#230/#231),
  # заменяет mesh-топологию WebRTC-соединений. canyan/janus-gateway —
  # единственный проверенно доступный на Docker Hub образ Janus Gateway с
  # уже собранным плагином videoroom; у него нет entrypoint-обвязки с
  # шаблонизацией конфига через переменные окружения (сам бинарник —
  # единственная команда контейнера), поэтому конфигурация идёт
  # исключительно через смонтированные .jcfg-файлы поверх дефолтных (см.
  # комментарии в services/janus/config/janus.jcfg).
  #
  # За отдельным профилем, не в default up -d — в отличие от Postgres
  # выше, ни один сервис пока не требует Janus для прохождения своих
  # тестов (chat-service::JanusClient отказывает мягко, если Janus
  # недоступен — см. doc-комментарий WebSocketServer::handleCallJoin()), а
  # `docker compose up -d --wait` гоняется в каждой job CI (.github/
  # workflows/ci.yml) — пока это не изменится (issue #232/#233), лишний
  # образ/healthcheck там не нужен ни одной из них. Тот же приём, что и у
  # ci-metrics-postgres/grafana ниже, хоть и по другой причине.
  janus:
    profiles: ["sfu"]
    image: canyan/janus-gateway:latest
    ports:
      # 8088 — plain HTTP Janus API: chat-service (issue #231, JanusClient)
      # работает нативным процессом на хосте, а не внутри docker-compose,
      # поэтому ему, как и разработчику для ручной проверки curl'ом, нужен
      # опубликованный на хост порт, а не только внутренняя docker-сеть.
      # 8188 — WebSocket Janus API, тем же способом, на будущее (сейчас не
      # используется — JanusClient ходит только по HTTP). 10000-10200/udp
      # — диапазон RTP-медиа, должен совпадать с media.rtp_port_range в
      # janus.jcfg.
      - "8188:8188"
      - "8088:8088"
      - "10000-10200:10000-10200/udp"
    volumes:
      - ./services/janus/config/janus.jcfg:/usr/local/etc/janus/janus.jcfg:ro
      - ./services/janus/config/janus.plugin.videoroom.jcfg:/usr/local/etc/janus/janus.plugin.videoroom.jcfg:ro
    healthcheck:
      # В образе нет curl/wget/nc — единственный доступный примитив для
      # проверки того, что Janus слушает HTTP-порт, это встроенный в bash
      # /dev/tcp (bash в образе есть, хоть и не как login shell по
      # умолчанию).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8088"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  user-service-postgres-data:
  chat-service-postgres-data:
  ci-metrics-postgres-data:
  grafana-data:
